name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      HF_HOME: ~/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v2
      # Includes the canary-leak tests: any leak fails this job and blocks the release.
      - name: Tests on SQLite
        run: pytest -m "not browser"
      - name: Tests on Postgres, with row-level security
        env:
          BATON_TEST_POSTGRES_URL: postgresql://postgres:test@localhost:5432/postgres
        run: pytest -m "not browser"
      - name: Gold-set scores
        run: python eval/evaluate.py
      - name: Browser, accessibility and voice walkthrough
        run: |
          playwright install --with-deps chromium
          pytest -m browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/shots
