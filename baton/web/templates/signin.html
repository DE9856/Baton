{% extends "base.html" %}
{% block title %}Sign in · Baton{% endblock %}
{% block content %}
<div class="title-row" style="margin-top: 40px"><div><h1>Sign in</h1>
<p class="finding">Sign in with the email your team added you with to see your view of a handover. You don't need an account for the demo.</p></div></div>
<form method="post" action="/signin" class="panel formpanel" style="max-width: 420px">
  <div class="field"><label for="email">Email</label><input id="email" type="email" name="email" required autocomplete="email" spellcheck="false" maxlength="200"></div>
  <div class="field"><label for="pw">Password</label><input id="pw" type="password" name="password" required minlength="8" autocomplete="current-password"></div>
  <div class="formactions">
    <button type="submit" name="action" value="signin">Sign in</button>
    <button type="submit" name="action" value="signup" class="secondary">Create an account</button>
  </div>
</form>
{% endblock %}
